<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F1F1F4" />

        overscroll-behavior-y: none;
      }
      button {
        font-family: inherit;
      }
      input,
      textarea {
        font-family: inherit;
        font-size: 16px; /* iOS에서 입력 시 화면 확대되는 것 방지 */
